<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#111111">
  <title>NOVEX | متجر التسوق</title>
  <style>
    *{box-sizing:border-box}
    body{margin:0;font-family:Arial,sans-serif;background:#f5f5f5;color:#111}
    header{background:#111;color:#fff;padding:14px 18px;position:sticky;top:0;z-index:20}
    nav{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
    .logo{font-size:24px;font-weight:900;letter-spacing:2px}
    .nav-actions{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
    nav button{background:#fff;color:#111;border:none;padding:8px 12px;border-radius:6px;font-weight:700;cursor:pointer}
    nav button.admin-toggle{background:#2b2b2b;color:#fff;border:1px solid #555}
    .hero{background:#171717;color:#fff;text-align:center;padding:36px 18px}
    .hero h1{margin:0 0 8px;font-size:32px;letter-spacing:3px}
    .hero p{margin:0 0 18px;color:#ccc}
    .hero a{display:inline-block;background:#fff;color:#111;text-decoration:none;padding:10px 20px;border-radius:6px;font-weight:700}
    h2{text-align:center;margin:26px 0 16px}
    .products{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px;padding:0 14px;max-width:960px;margin:0 auto}
    .card{background:#fff;border-radius:10px;padding:12px;box-shadow:0 2px 8px rgba(0,0,0,.08);display:flex;flex-direction:column;justify-content:space-between}
    .card img{width:100%;height:150px;object-fit:cover;border-radius:8px;background:#eee}
    .card h3{margin:10px 0 4px;font-size:16px}
    .price{font-weight:700;margin:0 0 10px}
    .card button{width:100%;background:#111;color:#fff;border:none;padding:10px;border-radius:6px;font-weight:700;cursor:pointer}
    .del-btn{margin-top:6px;background:#b91c1c !important}
    .box{max-width:960px;margin:24px auto;background:#fff;padding:18px;border-radius:10px;box-shadow:0 2px 8px rgba(0,0,0,.08)}
    .cart-item{display:flex;justify-content:space-between;align-items:center;padding:8px 0;border-bottom:1px solid #eee;gap:8px}
    .qty-btns button{background:#111;color:#fff;border:none;padding:4px 9px;border-radius:4px;cursor:pointer;font-weight:700}
    .whatsapp-btn{width:100%;margin-top:14px;background:#16a34a;color:#fff;border:none;padding:12px;border-radius:8px;font-size:16px;font-weight:700;cursor:pointer}
    .admin-panel{display:none;max-width:960px;margin:20px auto;background:#fff;padding:18px;border-radius:10px;border:2px solid #111}
    .admin-panel input{width:100%;padding:10px;margin:6px 0 12px;border:1px solid #ccc;border-radius:6px}
    .admin-panel button.save-btn{background:#111;color:#fff;border:none;padding:10px 16px;border-radius:6px;font-weight:700;cursor:pointer}
    footer{background:#111;color:#fff;text-align:center;padding:20px;margin-top:30px}
  </style>
</head>
<body>
  <header>
    <nav>
      <div class="logo">NOVEX</div>
      <div class="nav-actions">
        <button type="button" id="adminBtn">+ المنتجات</button>
        <button type="button" id="scrollCartBtn">السلة (<span id="cartCount">0</span>)</button>
      </div>
    </nav>
  </header>

  <section class="hero">
    <h1>NOVEX</h1>
    <p>اكتشف منتجاتك المفضلة في مكان واحد — تسوق بسهولة أينما كنت في المغرب</p>
    <a href="#productsSection">اكتشف المنتجات</a>
  </section>

  <section class="admin-panel" id="adminPanel">
    <h3>إضافة منتج جديد</h3>
    <label for="prodName">اسم المنتج</label>
    <input type="text" id="prodName" placeholder="مثال: سماعة لاسلكية">
    <label for="prodPrice">الثمن (درهم)</label>
    <input type="number" id="prodPrice" placeholder="مثال: 150">
    <label for="prodImgUrl">رابط صورة مباشر (اختياري)</label>
    <input type="text" id="prodImgUrl" placeholder="https://...">
    <label for="prodImgFile">أو صورة من الهاتف (اختياري)</label>
    <input type="file" id="prodImgFile" accept="image/*">
    <button type="button" class="save-btn" id="addProdBtn">إضافة المنتج</button>
  </section>

  <h2 id="productsSection">منتجاتنا</h2>
  <div class="products" id="productsGrid"></div>

  <section class="box" id="cartSection">
    <h2>🛒 سلة المشتريات</h2>
    <div id="cartItems">السلة فارغة حالياً</div>
    <p style="font-weight:700;font-size:18px;margin-top:12px">المجموع: <span id="cartTotal">0</span> درهم</p>
    <button type="button" class="whatsapp-btn" id="whatsappBtn">اطلب عبر WhatsApp</button>
  </section>

  <footer>NOVEX — جميع الحقوق محفوظة</footer>

  <script>
    const ADMIN_PIN = "1234";
    const WHATSAPP_NUMBER = "212641310872";
    const FALLBACK_IMG = "https://via.placeholder.com/400x300?text=NOVEX";

    const defaultProducts = [
      { id: 1, name: "كاميرا صغيرة", price: 299, img: "https://images.unsplash.com/photo-1526170375885-4d8ecf77b99f?w=500" },
      { id: 2, name: "إكسسوارات عصرية", price: 99, img: "https://images.unsplash.com/photo-1523275335684-37898b6baf30?w=500" },
      { id: 3, name: "سماعات رأس", price: 149, img: "https://images.unsplash.com/photo-1505740420928-5e560c06d30e?w=500" },
      { id: 4, name: "ساعة ذكية", price: 199, img: "https://images.unsplash.com/photo-1546868871-7041f2a55e12?w=500" }
    ];

    let products = [];
    let cart = [];

    function loadData() {
      try {
        const savedProducts = JSON.parse(localStorage.getItem("novex_products_v1"));
        products = Array.isArray(savedProducts) && savedProducts.length ? savedProducts : [...defaultProducts];
      } catch (e) {
        products = [...defaultProducts];
      }
      try {
        const savedCart = JSON.parse(localStorage.getItem("novex_cart_v1"));
        cart = Array.isArray(savedCart) ? savedCart : [];
      } catch (e) {
        cart = [];
      }
    }

    function saveData() {
      try {
        localStorage.setItem("novex_products_v1", JSON.stringify(products));
        localStorage.setItem("novex_cart_v1", JSON.stringify(cart));
      } catch (e) {
        console.warn("Storage limit reached");
      }
    }

    function renderProducts() {
      const grid = document.getElementById("productsGrid");
      grid.innerHTML = "";
      products.forEach((p) => {
        const card = document.createElement("div");
        card.className = "card";

        const img = document.createElement("img");
        img.src = p.img || FALLBACK_IMG;
        img.alt = p.name;
        img.onerror = function () { this.src = FALLBACK_IMG; };

        const title = document.createElement("h3");
        title.textContent = p.name;

        const price = document.createElement("p");
        price.className = "price";
        price.textContent = `${Number(p.price)} درهم`;

        const addBtn = document.createElement("button");
        addBtn.type = "button";
        addBtn.textContent = "أضف إلى السلة";
        addBtn.addEventListener("click", function () {
          addToCart(p.id);
        });

        card.appendChild(img);
        card.appendChild(title);
        card.appendChild(price);
        card.appendChild(addBtn);

        if (products.length > 1) {
          const delBtn = document.createElement("button");
          delBtn.type = "button";
          delBtn.className = "del-btn";
          delBtn.textContent = "حذف المنتج";
          delBtn.addEventListener("click", function () {
            deleteProduct(p.id);
          });
          card.appendChild(delBtn);
        }

        grid.appendChild(card);
      });
    }

    function addToCart(productId) {
      const prod = products.find((item) => item.id === productId);
      if (!prod) return;

      const existing = cart.find((item) => item.id === productId);
      if (existing) {
        existing.qty += 1;
      } else {
        cart.push({ id: prod.id, name: prod.name, price: Number(prod.price), qty: 1 });
      }
      saveData();
      renderCart();
    }

    function changeQty(productId, delta) {
      const item = cart.find((i) => i.id === productId);
      if (!item) return;
      item.qty += delta;
      if (item.qty <= 0) {
        cart = cart.filter((i) => i.id !== productId);
      }
      saveData();
      renderCart();
    }

    function deleteProduct(productId) {
      products = products.filter((p) => p.id !== productId);
      cart = cart.filter((c) => c.id !== productId);
      saveData();
      renderProducts();
      renderCart();
    }

    function renderCart() {
      const container = document.getElementById("cartItems");
      const countEl = document.getElementById("cartCount");
      const totalEl = document.getElementById("cartTotal");

      const totalQty = cart.reduce((sum, item) => sum + item.qty, 0);
      const totalPrice = cart.reduce((sum, item) => sum + item.price * item.qty, 0);

      countEl.textContent = String(totalQty);
      totalEl.textContent = String(totalPrice);

      if (!cart.length) {
        container.textContent = "السلة فارغة حالياً";
        return;
      }

      container.innerHTML = "";
      cart.forEach((item) => {
        const row = document.createElement("div");
        row.className = "cart-item";

        const info = document.createElement("span");
        info.textContent = `${item.name} × ${item.qty} (${item.price * item.qty} درهم)`;

        const controls = document.createElement("div");
        controls.className = "qty-btns";

        const minusBtn = document.createElement("button");
        minusBtn.type = "button";
        minusBtn.textContent = "-";
        minusBtn.addEventListener("click", function () { changeQty(item.id, -1); });

        const plusBtn = document.createElement("button");
        plusBtn.type = "button";
        plusBtn.textContent = "+";
        plusBtn.addEventListener("click", function () { changeQty(item.id, 1); });

        controls.appendChild(minusBtn);
        controls.appendChild(plusBtn);
        row.appendChild(info);
        row.appendChild(controls);
        container.appendChild(row);
      });
    }

    function toggleAdmin() {
      const panel = document.getElementById("adminPanel");
      if (panel.style.display === "block") {
        panel.style.display = "none";
        return;
      }
      const pin = prompt("أدخل الرمز السري:");
      if (pin === ADMIN_PIN) {
        panel.style.display = "block";
      } else if (pin !== null) {
        alert("الرمز السري غير صحيح");
      }
    }

    function handleAddProduct() {
      const nameInput = document.getElementById("prodName");
      const priceInput = document.getElementById("prodPrice");
      const urlInput = document.getElementById("prodImgUrl");
      const fileInput = document.getElementById("prodImgFile");

      const name = nameInput.value.trim();
      const price = Number(priceInput.value);
      const url = urlInput.value.trim();

      if (!name || !price || price <= 0) {
        alert("يرجى إدخال اسم المنتج والثمن الصحيح");
        return;
      }

      const finishAdd = (imgSrc) => {
        const newProd = {
          id: Date.now(),
          name,
          price,
          img: imgSrc || FALLBACK_IMG
        };
        products.unshift(newProd);
        saveData();
        renderProducts();
        nameInput.value = "";
        priceInput.value = "";
        urlInput.value = "";
        fileInput.value = "";
      };

      if (fileInput.files && fileInput.files[0]) {
        const reader = new FileReader();
        reader.onload = function (ev) {
          finishAdd(ev.target.result);
        };
        reader.readAsDataURL(fileInput.files[0]);
      } else {
        finishAdd(url);
      }
    }

    function sendWhatsAppOrder() {
      if (!cart.length) {
        alert("أضف منتجاً أولاً");
        return;
      }
      let lines = ["مرحباً متجر NOVEX، أود طلب المنتجات التالية:"];
      let total = 0;
      cart.forEach((item) => {
        const lineTotal = item.price * item.qty;
        total += lineTotal;
        lines.push(`- ${item.name} (${item.qty}) = ${lineTotal} درهم`);
      });
      lines.push(`المجموع: ${total} درهم`);
      const text = encodeURIComponent(lines.join("\n"));
      window.open(`https://wa.me/${WHATSAPP_NUMBER}?text=${text}`, "_blank");
    }

    document.getElementById("adminBtn").addEventListener("click", toggleAdmin);
    document.getElementById("scrollCartBtn").addEventListener("click", function () {
      document.getElementById("cartSection").scrollIntoView({ behavior: "smooth" });
    });
    document.getElementById("addProdBtn").addEventListener("click", handleAddProduct);
    document.getElementById("whatsappBtn").addEventListener("click", sendWhatsAppOrder);

    loadData();
    renderProducts();
    renderCart();
  </script>
</body>
</html>
